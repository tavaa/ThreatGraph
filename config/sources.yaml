# ThreatGraph-LD -- registry of pinned sources (Phase 1)
#
# Every URL points to an immutable git commit, never to a branch.
# Every file has the SHA-256 that was observed when the pins were chosen
# (2026-10-13). A mismatch at download time means the upstream changed or
# the transfer was corrupted -> Phase 1 must fail loudly.
#
# Common version ("snapshot date"): 2025-07-28
#   KEV  catalogVersion 2025.07.28
#   NVD  mirror tag v2025.07.28-000002  (records with lastModified <= cutoff)
#   ATT&CK Enterprise 16.1  (STIX 2.1)
#   PKEV (CTID Mappings Explorer) kev-07.28.2025 + attack-16.1

common_version:
  label: "2025-07-28"
  nvd_cutoff_utc: "2025-07-28T00:00:00Z"
  attack_version: "16.1"
  kev_catalog_version: "2025.07.28"
  pkev_framework_version: "07/28/2025"

